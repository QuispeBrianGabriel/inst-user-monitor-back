name: Pipeline

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los tests de integración arrancan la API contra una base real (config/test.yaml).
    # PostgreSQL 18, como en docker/compose.yml: el esquema usa uuidv7().
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inst_user_monitor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inst_user_monitor_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets
      - name: Test
        run: cargo test --locked
