# Configuración de producción (imagen de docker/Dockerfile.prod).
#
# Se diferencia de desarrollo a propósito en una cosa: los secretos y las
# direcciones no tienen valor por defecto. `get_env` sin `default` hace fallar
# el arranque si falta la variable: mejor no arrancar que arrancar contra una
# base o con un secreto equivocados.
#
# Variables obligatorias: DATABASE_URL y JWT_SECRET.
# Opcionales: PORT, LOG_LEVEL, LOG_FORMAT, JWT_TTL_MINUTES, CORS_ORIGIN, CLIENT_IP_SOURCE,
# DB_*.

logger:
  enable: true
  # Desactivado: cuesta rendimiento y mete rutas del código fuente en los logs.
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Texto plano por defecto: Railway muestra el `message` de primer nivel de
  # las líneas JSON y el de Loco va anidado en `fields`, así que en su panel
  # cada línea JSON salía vacía. LOG_FORMAT=json para un agregador que lo lea.
  # compact, pretty o json.
  format: <%= get_env(name="LOG_FORMAT", default="compact") %>

server:
  port: <%= get_env(name="PORT", default="8080") %>
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  host: <%= get_env(name="HOST", default="http://localhost") %>
  middlewares:
    limit_payload:
      body_limit: 16kb
    timeout_request:
      enable: true
      timeout: 10000
    cors:
      enable: true
      allow_origins: [<% for origin in get_env(name="CORS_ORIGIN", default="http://localhost:3000") | split(pat=",") %>"<%= origin | trim %>"<% if not loop.last %>, <% endif %><% endfor %>]
      allow_methods: ["GET", "POST"]
      allow_headers: ["content-type", "authorization"]
    etag:
      enable: false
    # De dónde sale la IP del cliente (la usa el rate limit de /auth). Por
    # defecto, la de la conexión. Detrás de un proxy (Railway, Heroku...) esa
    # es la del proxy y todos los usuarios compartirían límite: hay que
    # elegir la cabecera que pone el proxy, p. ej. XRealIp en Railway.
    # Solo una cabecera que el proxy sobrescribe siempre: si no, se falsifica.
    # Valores: ConnectInfo, XRealIp, RightmostXForwardedFor, CfConnectingIp...
    remote_ip:
      enable: true
      source: <%= get_env(name="CLIENT_IP_SOURCE", default="ConnectInfo") %>

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  # Por defecto, `/server start` aplica las migraciones pendientes antes de
  # atender peticiones: sin ellas no existe la tabla users y todo /auth
  # responde 500. Es idempotente y basta con una réplica (Railway por defecto).
  # Con varias réplicas cada una intentaría migrar a la vez: entonces
  # DB_AUTO_MIGRATE=false y `/server db migrate` como pre-deploy command
  # (12-factor XII, una vez por release).
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET") %>
    expiration: <%= get_env(name="JWT_TTL_MINUTES", default="15") | int * 60 %>
