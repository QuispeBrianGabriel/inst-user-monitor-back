# Configuración de cargo del proyecto (aplica en local, en el Dev Container y en CI).

[build]
# Cualquier warning (rustc, clippy o del propio cargo, como una dependencia
# sin usar) hace fallar el comando: build, run, test y clippy por igual.
# Es la única fuente de esta regla: no hace falta `-D warnings` en ningún sitio.
warnings = "deny"
