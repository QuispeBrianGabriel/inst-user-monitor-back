[workspace]

[package]
name = "inst-user-monitor-back"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "inst_user_monitor_back-cli"

[workspace.dependencies]
loco-rs = { version = "1.3.1", default-features = false }

[dependencies]
# Solo las features que usa la API: auth (JWT + hash), CLI (`cargo loco`),
# PostgreSQL y los generadores (`cargo loco generate`).
loco-rs = { workspace = true, features = ["auth", "cli", "with-db", "db-postgres", "generators"] }
migration = { path = "migration" }

async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread"] }
# Loco no trae limitador de peticiones: se aplica como capa de las rutas de auth.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[[bin]]
name = "inst_user_monitor_back-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing-core"] }
# Misma versión que usa el harness de Loco (`TestServer`).
axum-test = "17.3.0"
# Los tests de integración comparten la base de test: se ejecutan de uno en uno.
serial_test = "3.2.0"

[profile.release]
strip = true
lto = "thin"

# Las dependencias se compilan sin info de depuración (target/ ocupa la mitad);
# el código propio la conserva para breakpoints y backtraces.
[profile.dev.package."*"]
debug = false
