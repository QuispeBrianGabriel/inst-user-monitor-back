name: inst_user_monitor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Base de los tests de integración (config/test.yaml): se recrea en cada test
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en docker/.env (ejecuta make setup)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/app
      - cargo-registry:/usr/local/cargo/registry
    depends_on:
      - db
    init: true

  db:
    image: postgres:18
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  cargo-registry:
  pgdata:
