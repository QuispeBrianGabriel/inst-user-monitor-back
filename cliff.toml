# Notas de cada release a partir de los conventional commits (git-cliff).
# Las usa .github/workflows/release.yml.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# El comentario HTML fija el orden de los grupos y no se muestra
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Funcionalidades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correcciones" },
  { message = "^perf", group = "<!-- 2 -->⚡ Rendimiento" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentación" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->⚙️ Build y CI" },
  { message = "^chore", group = "<!-- 7 -->🧹 Mantenimiento" },
]
